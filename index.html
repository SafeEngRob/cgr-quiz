<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CGR Quiz App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: pan-y;
      /* Permite scroll vertical y captura swipes */
    }

    .card-swipe {
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
    }
    select option {
      background-color: #202124;
      color: #f1f3f4;
    }
  </style>
</head>

<body
  class="bg-gradient-to-b from-[#202124] via-[#1a1b1e] to-[#121314] text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-[#4285F4] selection:text-white">

  <!-- Barra decorativa superior con los 4 colores de Google -->
  <div class="fixed top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#4285F4] via-[#EA4335] via-[#FBBC05] to-[#34A853] z-50"></div>

  <!-- Header / Barra superior con selector de temas y contador -->
  <header class="w-full max-w-md mx-auto flex items-center justify-between gap-3 pt-2 pb-3">
    <!-- Selector de Temas -->
    <div class="relative flex-1 min-w-0">
      <select id="select-tema" onchange="cambiarTema(this.value)"
        class="w-full appearance-none bg-[#303134] hover:bg-[#3c4043] text-slate-200 text-xs font-semibold rounded-full pl-3.5 pr-8 py-2 border border-[#5f6368]/40 focus:outline-none focus:border-[#4285F4] focus:ring-1 focus:ring-[#4285F4] transition truncate cursor-pointer shadow-sm">
        <option value="TODOS">📚 Todos los temas</option>
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#8ab4f8]">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>

    <!-- Contador de progreso -->
    <div class="text-xs text-slate-300 font-medium whitespace-nowrap bg-[#303134] px-3 py-1.5 rounded-full border border-[#5f6368]/40 shadow-sm flex items-center gap-1 flex-shrink-0">
      <span id="contador-progreso" class="text-[#8ab4f8] font-bold">1</span>
      <span class="text-slate-500">/</span>
      <span id="total-preguntas" class="text-slate-400">0</span>
    </div>
  </header>

  <!-- Contenedor Principal (Tarjeta interactiva con gesto swipe) -->
  <main id="quiz-card" class="card-swipe w-full max-w-md mx-auto flex-1 flex flex-col justify-center my-auto">

    <!-- Chip del tema de la pregunta actual -->
    <div class="flex justify-center mb-3">
      <span id="badge-tema"
        class="max-w-full text-center px-3.5 py-1 rounded-full border border-[#4285F4]/30 bg-[#4285F4]/15 text-[#8ab4f8] text-[11px] font-semibold tracking-wide">
        Tema
      </span>
    </div>

    <!-- Enunciado de la Pregunta -->
    <h1 id="texto-pregunta"
      class="text-lg md:text-xl font-bold text-center leading-snug tracking-tight mb-6 px-2 text-slate-100">
      Cargando pregunta...
    </h1>

    <!-- Contenedor de Opciones A, B, C, D -->
    <div id="contenedor-opciones" class="flex flex-col gap-3 w-full">
      <!-- Opciones renderizadas con JS -->
    </div>

    <!-- Sección de Explicación / Fundamento (Oculta al inicio) -->
    <div id="caja-fundamento"
      class="hidden mt-4 p-4 rounded-2xl bg-[#303134] border border-[#fbbc04]/40 text-xs text-slate-200 leading-relaxed shadow-lg">
      <div class="font-bold text-[#fbbc04] mb-1 flex items-center gap-1.5">
        <span>📖 Fundamento Normativo</span>
      </div>
      <p id="texto-fundamento" class="text-slate-300"></p>
    </div>

  </main>

  <!-- Barra Inferior de Navegación -->
  <footer class="w-full max-w-md mx-auto py-4 flex flex-col items-center gap-3">
    <div class="w-full flex items-center gap-3">
      <!-- Botón Anterior -->
      <button id="btn-prev" onclick="retrocederPregunta()"
        class="flex-1 py-3 px-4 rounded-full border border-[#5f6368]/40 bg-[#303134] hover:bg-[#3c4043] active:scale-[0.98] text-slate-200 text-xs font-bold tracking-wider uppercase transition flex items-center justify-center gap-2 shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Anterior</span>
      </button>

      <!-- Botón Siguiente -->
      <button id="btn-next" onclick="avanzarPregunta()"
        class="flex-1 py-3 px-4 rounded-full bg-[#1a73e8] hover:bg-[#1557b0] active:scale-[0.98] text-white text-xs font-bold tracking-wider uppercase transition flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20">
        <span>Siguiente</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </div>
    <span class="text-[11px] text-slate-400 font-medium">← Desliza hacia la derecha o izquierda →</span>
  </footer>

  <!-- Carga del banco de preguntas -->
  <script src="preguntas.js"></script>

  <!-- Lógica de la Aplicación -->
  <script>
    let indiceActual = 0;
    let respondida = false;
    const listaPreguntas = typeof BANCO_PREGUNTAS !== 'undefined' ? BANCO_PREGUNTAS : [];
    let preguntasFiltradas = [];

    // Elementos del DOM
    const badgeTema = document.getElementById('badge-tema');
    const selectTema = document.getElementById('select-tema');
    const textoPregunta = document.getElementById('texto-pregunta');
    const contenedorOpciones = document.getElementById('contenedor-opciones');
    const cajaFundamento = document.getElementById('caja-fundamento');
    const textoFundamento = document.getElementById('texto-fundamento');
    const contadorProgreso = document.getElementById('contador-progreso');
    const totalPreguntas = document.getElementById('total-preguntas');
    const quizCard = document.getElementById('quiz-card');

    function inicializar() {
      if (!listaPreguntas.length) {
        textoPregunta.innerText = "No se encontraron preguntas en preguntas.js.";
        return;
      }

      poblarSelectorTemas();

      // Recuperar último tema seleccionado de sesión previa
      const temaGuardado = localStorage.getItem('cgr_quiz_tema') || 'TODOS';
      if (selectTema) {
        selectTema.value = temaGuardado;
      }
      cambiarTema(temaGuardado, false);
    }

    function poblarSelectorTemas() {
      if (!selectTema) return;

      const temasUnicos = [];
      const conteoTemas = {};

      listaPreguntas.forEach(p => {
        const t = p.tema ? p.tema.trim() : "Otros";
        if (!conteoTemas[t]) {
          conteoTemas[t] = 0;
          temasUnicos.push(t);
        }
        conteoTemas[t]++;
      });

      selectTema.innerHTML = `<option value="TODOS">📚 Todos los temas (${listaPreguntas.length})</option>`;

      temasUnicos.forEach(tema => {
        const opt = document.createElement('option');
        opt.value = tema;
        opt.textContent = `📁 ${tema} (${conteoTemas[tema]})`;
        selectTema.appendChild(opt);
      });
    }

    function cambiarTema(temaSeleccionado, reiniciarIndice = true) {
      if (temaSeleccionado === 'TODOS') {
        preguntasFiltradas = [...listaPreguntas];
      } else {
        preguntasFiltradas = listaPreguntas.filter(p => (p.tema ? p.tema.trim() : "Otros") === temaSeleccionado);
      }

      try {
        localStorage.setItem('cgr_quiz_tema', temaSeleccionado);
      } catch (e) {}

      if (reiniciarIndice) {
        indiceActual = 0;
      } else {
        if (indiceActual >= preguntasFiltradas.length) {
          indiceActual = 0;
        }
      }

      totalPreguntas.innerText = preguntasFiltradas.length;

      if (preguntasFiltradas.length > 0) {
        mostrarPregunta(indiceActual);
      } else {
        textoPregunta.innerText = "No hay preguntas disponibles para este tema.";
        contenedorOpciones.innerHTML = '';
        badgeTema.innerText = temaSeleccionado;
        contadorProgreso.innerText = "0";
      }
    }

    function mostrarPregunta(indice) {
      if (!preguntasFiltradas.length) return;
      respondida = false;
      cajaFundamento.classList.add('hidden');
      quizCard.style.transform = 'translateX(0)';
      quizCard.style.opacity = '1';

      const item = preguntasFiltradas[indice];
      badgeTema.innerText = item.tema || "Cuestionario";
      contadorProgreso.innerText = indice + 1;
      textoPregunta.innerText = item.pregunta;

      contenedorOpciones.innerHTML = '';

      Object.entries(item.opciones).forEach(([letra, texto]) => {
        if (!texto) return;

        const boton = document.createElement('button');
        boton.className = "group relative w-full flex items-center gap-3.5 p-3.5 rounded-2xl bg-[#303134]/90 hover:bg-[#3c4043] border border-[#5f6368]/30 active:scale-[0.99] text-left transition-all duration-150 backdrop-blur-sm shadow-sm";
        boton.innerHTML = `
          <span class="letra-circulo flex-shrink-0 w-8 h-8 rounded-full bg-[#1a73e8] group-hover:bg-[#1557b0] flex items-center justify-center font-bold text-xs text-white transition-colors shadow-sm">
            ${letra}
          </span>
          <span class="text-xs md:text-sm font-medium text-slate-200 leading-snug">
            ${texto}
          </span>
        `;

        boton.onclick = () => seleccionarOpcion(letra, item.correcta, item.fundamento, boton);
        contenedorOpciones.appendChild(boton);
      });
    }

    function seleccionarOpcion(seleccionada, correcta, fundamento, boton) {
      if (respondida) return;
      respondida = true;

      const botones = contenedorOpciones.querySelectorAll('button');

      botones.forEach(btn => {
        const letra = btn.querySelector('.letra-circulo').innerText.trim();
        if (letra === correcta) {
          // Marca correcta con verde estilo Google (#34a853)
          btn.classList.remove('bg-[#303134]/90', 'border-[#5f6368]/30');
          btn.classList.add('bg-[#34a853]/20', 'border-[#34a853]', 'shadow-[#34a853]/10');
          btn.querySelector('.letra-circulo').classList.remove('bg-[#1a73e8]');
          btn.querySelector('.letra-circulo').classList.add('bg-[#34a853]');
        } else if (letra === seleccionada) {
          // Marca incorrecta con rojo estilo Google (#ea4335)
          btn.classList.remove('bg-[#303134]/90', 'border-[#5f6368]/30');
          btn.classList.add('bg-[#ea4335]/20', 'border-[#ea4335]', 'shadow-[#ea4335]/10');
          btn.querySelector('.letra-circulo').classList.remove('bg-[#1a73e8]');
          btn.querySelector('.letra-circulo').classList.add('bg-[#ea4335]');
        }
      });

      // Muestra justificación si existe
      if (fundamento) {
        textoFundamento.innerText = fundamento;
        cajaFundamento.classList.remove('hidden');
      }
    }

    function avanzarPregunta() {
      if (preguntasFiltradas.length <= 1) return;
      // Animación de salida hacia la izquierda
      quizCard.style.transform = 'translateX(-30px)';
      quizCard.style.opacity = '0';

      setTimeout(() => {
        indiceActual = (indiceActual + 1) % preguntasFiltradas.length;
        mostrarPregunta(indiceActual);
      }, 180);
    }

    function retrocederPregunta() {
      if (preguntasFiltradas.length <= 1) return;
      // Animación de salida hacia la derecha
      quizCard.style.transform = 'translateX(30px)';
      quizCard.style.opacity = '0';

      setTimeout(() => {
        indiceActual = (indiceActual - 1 + preguntasFiltradas.length) % preguntasFiltradas.length;
        mostrarPregunta(indiceActual);
      }, 180);
    }

    // --- Detección de Gestos Táctiles (Swipe en ambas direcciones) ---
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartY = 0;
    let touchEndY = 0;

    quizCard.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    quizCard.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const umbralX = 50; // Desplazamiento mínimo horizontal en px
      const diffX = touchStartX - touchEndX;
      const diffY = Math.abs(touchStartY - touchEndY);

      // Solo activar si el gesto horizontal predomina sobre el vertical (evita interferir con scroll)
      if (Math.abs(diffX) > diffY && Math.abs(diffX) > umbralX) {
        if (diffX > 0) {
          // Deslizamiento hacia la izquierda -> Siguiente pregunta
          avanzarPregunta();
        } else {
          // Deslizamiento hacia la derecha -> Pregunta anterior
          retrocederPregunta();
        }
      }
    }

    // Teclas de dirección (PC)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        avanzarPregunta();
      } else if (e.key === 'ArrowLeft') {
        retrocederPregunta();
      }
    });

    inicializar();
  </script>
</body>

</html>
